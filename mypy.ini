[mypy]
python_version = 3.9
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
mypy_path = api
explicit_package_bases = true
namespace_packages = true
follow_imports = silent
files = api/services/charts,api/services/chat,api/services/reports,api/repositories,api/agents/providers.py,api/agents/tools,api/agents/strategies,api/agents/adapters

[mypy-bma_med.*]
ignore_missing_imports = true

[mypy-pyecharts.*]
ignore_missing_imports = true

[mypy-anthropic.*]
ignore_missing_imports = true

[mypy-yaml]
ignore_missing_imports = true

[mypy-jinja2]
ignore_missing_imports = true

[mypy-psycopg2]
ignore_missing_imports = true

[mypy-psycopg2.*]
ignore_missing_imports = true

[mypy-scipy]
ignore_missing_imports = true

[mypy-scipy.*]
ignore_missing_imports = true

[mypy-matplotlib]
ignore_missing_imports = true

[mypy-matplotlib.*]
ignore_missing_imports = true

[mypy-numpy]
