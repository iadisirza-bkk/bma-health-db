<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BMA Health Admin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Sidebar -->
    <aside class="fixed top-0 left-0 w-60 h-full bg-slate-800 text-white flex flex-col z-30">
        <div class="px-6 py-5 border-b border-slate-700">
            <h1 class="text-lg font-bold tracking-wide">BMA Health DB</h1>
            <p class="text-xs text-slate-400 mt-1">Admin Panel</p>
        </div>
        <nav class="flex-1 px-3 py-4 space-y-1">
            <a href="/admin/dashboard"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors
                      {% if active_page == 'dashboard' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-700 hover:text-white{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/>
                </svg>
                Dashboard
            </a>
            <a href="/admin/upload"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors
                      {% if active_page == 'upload' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-700 hover:text-white{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                </svg>
                Upload CSV
            </a>
            <a href="/admin/history"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors
                      {% if active_page == 'history' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-700 hover:text-white{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                Import History
            </a>
            <a href="/admin/logs"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors
                      {% if active_page == 'logs' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-700 hover:text-white{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                Logs
            </a>
        </nav>
        <div class="px-3 py-4 border-t border-slate-700">
            <a href="/admin/logout"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-700 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
                Logout
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="ml-60">
        <!-- Top Bar -->
        <header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
            <h2 class="text-lg font-semibold text-gray-800">BMA Health Admin</h2>
            <a href="/admin/logout" class="text-sm text-gray-500 hover:text-gray-700 transition-colors">Logout</a>
        </header>

        <!-- Flash Messages -->
        {% if messages %}
        <div class="px-6 pt-4 space-y-2">
            {% for message in messages %}
            <div class="px-4 py-3 rounded-lg text-sm font-medium
                        {% if message.type == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-green-50 text-green-700 border border-green-200{% endif %}"
                 role="alert">
                {{ message.text }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <!-- Page Content -->
        <main class="p-6">
            {% block content %}{% endblock %}
        </main>
    </div>

</body>
</html>
