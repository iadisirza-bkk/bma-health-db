<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ Admin - BMA Health DB</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-sm">
        <!-- Logo / Header -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800">BMA Health DB</h1>
            <p class="text-slate-500 text-sm mt-1">Admin Panel</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-xl shadow-lg p-8">
            <h2 class="text-xl font-semibold text-gray-800 mb-6 text-center">เข้าสู่ระบบ Admin</h2>

            {% if error %}
            <div class="mb-4 px-4 py-3 rounded-lg bg-red-50 text-red-700 border border-red-200 text-sm" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/admin/login">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="mb-5">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">รหัสผ่าน</label>
                    <input type="password" id="password" name="password" required autofocus
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
                           placeholder="ป้อนรหัสผ่าน">
                </div>
                <button type="submit"
                        class="w-full bg-indigo-600 text-white py-2.5 px-4 rounded-lg text-sm font-medium hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-colors">
                    เข้าสู่ระบบ
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-slate-400 mt-6">BMA Health Database Management System</p>
    </div>

</body>
</html>
