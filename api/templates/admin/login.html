<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ Admin - BMA Health DB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bma-green': '#00744B',
                        'bma-green-hover': '#005C3B',
                        'bma-green-light': '#e6f5ef',
                        'bma-gold': '#C9A94E',
                    },
                    fontFamily: {
                        sans: ["'Google Sans'", "'Noto Sans Thai'", 'sans-serif'],
                        display: ["'SaoChingcha'", "'Google Sans'", "'Noto Sans Thai'", 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @font-face { font-family: 'SaoChingcha'; src: url('/static/fonts/SaoChingcha-Light.otf') format('opentype'); font-weight: 300; }
        @font-face { font-family: 'SaoChingcha'; src: url('/static/fonts/SaoChingcha-Regular.otf') format('opentype'); font-weight: 400; }
        @font-face { font-family: 'SaoChingcha'; src: url('/static/fonts/SaoChingcha-Bold.otf') format('opentype'); font-weight: 700; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#00744B] to-[#005C3B] flex items-center justify-center px-4 font-sans">

    <div class="w-full max-w-md">
        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <!-- Logo / Header -->
            <div class="text-center mb-8">
                <img src="/static/images/logo-bma-256.png" alt="BMA" class="w-20 h-20 mx-auto mb-4">
                <h1 class="text-2xl font-display font-bold text-[#0f172a]">BMA Health DB</h1>
                <p class="text-[#475569] text-sm mt-1">ระบบจัดการฐานข้อมูลสุขภาพ</p>
            </div>

            <h2 class="text-lg font-semibold text-[#0f172a] mb-6 text-center">เข้าสู่ระบบ Admin</h2>

            {% if error %}
            <div class="mb-5 flex items-start gap-3 px-4 py-3 rounded-xl bg-red-50 text-red-800 border border-red-200 text-sm" role="alert">
                <svg class="w-5 h-5 flex-shrink-0 mt-0.5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/admin/login">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-[#0f172a] mb-2">รหัสผ่าน</label>
                    <input type="password" id="password" name="password" required autofocus
                           class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm text-[#0f172a] placeholder-[#94a3b8] focus:outline-none focus:ring-2 focus:ring-bma-green focus:border-bma-green transition-colors"
                           placeholder="ป้อนรหัสผ่าน">
                </div>
                <button type="submit"
                        class="w-full bg-bma-green text-white py-2.5 px-4 rounded-lg text-sm font-medium hover:bg-bma-green-hover focus:outline-none focus:ring-2 focus:ring-bma-green focus:ring-offset-2 transition-colors">
                    เข้าสู่ระบบ
                </button>
            </form>
        </div>

        <p class="text-center text-sm text-white/70 mt-6">BMA Health Database Management System</p>
    </div>

</body>
</html>
