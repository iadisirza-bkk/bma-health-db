# pg_hba.conf — SCRAM-SHA-256 only, IP-restricted
# v3 hardening (2026-04-27)

# TYPE  DATABASE  USER          ADDRESS         METHOD

# Local socket — postgres via trust (only reachable inside container where
# docker exec runs as root, not addressable from outside). Others via SCRAM.
local   all       postgres                      trust
local   all       all                           scram-sha-256

# Replication (for future WAL streaming) — only from local
host    replication  postgres   127.0.0.1/32    scram-sha-256
host    replication  postgres   ::1/128         scram-sha-256

# bma_etl_writer / bma_api_reader / bma_dba_admin via TCP (IPv4 + IPv6).
# In production: tighten ADDRESS to specific subnet, e.g. 172.18.0.0/16.
hostssl bma_health   etl_user    0.0.0.0/0      scram-sha-256
hostssl bma_health   etl_user    ::/0           scram-sha-256
hostssl bma_health   api_user    0.0.0.0/0      scram-sha-256
hostssl bma_health   api_user    ::/0           scram-sha-256
hostssl bma_health   dba_user    0.0.0.0/0      scram-sha-256
hostssl bma_health   dba_user    ::/0           scram-sha-256
# Allow non-SSL only from container-internal localhost (cloudflared tunnel)
host    bma_health   etl_user    127.0.0.1/32   scram-sha-256
host    bma_health   api_user    127.0.0.1/32   scram-sha-256
host    bma_health   etl_user    ::1/128        scram-sha-256
host    bma_health   api_user    ::1/128        scram-sha-256

# postgres superuser only via localhost (container-internal admin)
host    bma_health   postgres    127.0.0.1/32   scram-sha-256
host    bma_health   postgres    ::1/128        scram-sha-256
host    bma_health   postgres    172.16.0.0/12  scram-sha-256

# Deny everything else
host    all          all         0.0.0.0/0      reject
host    all          all         ::/0           reject
