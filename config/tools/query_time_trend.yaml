name: query_time_trend
description_th: Show monthly or quarterly screening trend for one or more diseases. Use for 'แนวโน้ม', 'เปลี่ยนไปยังไง', 'รายเดือน/ไตรมาส',
  'ปี 2024 vs 2025'.
class_path: agents.tools.insights:TimeTrendTool
enabled: true
audience:
- public
- clinician
parameters:
  type: object
  properties:
    disease:
      type: string
      enum:
      - diabetes
      - hypertension
      - cardiovascular
      - obesity
      - dyslipidemia
      - stroke
      description: Disease key. Omit to show total screened only.
    period:
      type: string
      enum:
      - month
      - quarter
      description: 'Aggregation granularity. Default: month.'
    from_date:
      type: string
      description: 'Start date (YYYY-MM-DD). Default: 2024-01-01.'
    to_date:
      type: string
      description: 'End date (YYYY-MM-DD). Default: today.'
